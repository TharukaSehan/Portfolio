name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - docs/**
      - react-portfolio/dist/**
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: cd react-portfolio && npm install

      - name: Build project
        run: cd react-portfolio && npm run build

      - name: Sync GitHub Pages docs folder
        run: |
          rm -rf docs/*
          cp -R react-portfolio/dist/* docs/

      - name: Commit updated docs
        run: |
          if git diff --quiet -- docs; then
            echo "No docs changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Update GitHub Pages site [skip ci]"
          git push origin HEAD:main

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./react-portfolio/dist
          cname: false
